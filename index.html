
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String Methods Homework</title>
    <script src="script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #243b55;
            font-size: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Signup Form</h1>

        <form id="signupForm">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="03XXXXXXXXX" maxlength="11">

            <label for="bio">Bio</label>
            <textarea id="bio" placeholder="Write at least 50 characters and 10 words"></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
